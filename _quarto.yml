project:
  type: book
  output-dir: docs
  render:
    - "*.qmd"
  post-render: scripts/sidebar_sections.py
  resources:
    - .nojekyll   # GitHub Pages: serve site_libs/ as is
    - img/logo-light.png
    - img/logo-dark.png

lang: en
language:
  crossref-ch-prefix: Chapter
  crossref-tip-title: "Example"     # numbered worked examples are collapsible tip callouts (#tip-...)
  crossref-tip-prefix: "Example"
  callout-tip-title: "Example"       # PDF name of numbered tip callouts
  crossref-sec-prefix: Sec.

book:
  title: "The Live Textbook of Physical Chemistry 2"
  output-file: pchem2
  author: "Roberto Peverati"
  description: "Volume 2 — Beyond the Classical World: Quantum Mechanics, Atoms, Molecules, and Spectra"   # print title, same as the PDF
  date: today
  date-format: "D MMMM YYYY"
  repo-url: https://github.com/peverati/pchem2
  repo-branch: master
  repo-actions: [issue]
  downloads: [pdf]
  search:
    location: sidebar
    type: textbox
  navbar:
    collapse: false     # no hamburger menu: the icons stay visible; the title is hidden on narrow screens (quarto.css)
    logo:
      light:
        path: img/logo-light.png
        alt: "Peverati research group logo"
      dark:
        path: img/logo-dark.png
        alt: "Peverati research group logo"
    logo-href: https://peverati.github.io
    title: false
    left:
      - text: "The Live Textbook of Physical Chemistry 2"
        href: index.qmd
    right:
      - icon: bug
        href: https://github.com/peverati/pchem2/issues/new
        aria-label: "Report a bug"
  page-footer:
    center: "Text and figures: [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) · Figure scripts: [MIT](https://github.com/peverati/pchem2/blob/master/scripts/LICENSE)"
  chapters:
    - index.qmd
    - 01_Classical.qmd
    - 02_Motivation.qmd
    - 03_Schrodinger.qmd
    - 04_Models.qmd
    - 05_Hydrogen.qmd
    - 06_Operators.qmd
    - 07_Spin.qmd
    - 08_Weirdness.qmd
    - 09_Atoms.qmd
    - 10_Molecules.qmd
    - 11_Bonds.qmd
    - 12_Polyatomic.qmd
    - 13_Spectroscopy.qmd
  appendices:
    - A1_Math.qmd
    - A2_Constants.qmd
    - A3_References.qmd

bibliography: book.bib
citation-location: document

filters:
  - path: pdf-fixes.lua      # "Eq. (5.7)" in the PDF; no empty line after each answer choice
    at: post-render

crossref:
  eq-prefix: Eq.
  fig-prefix: Fig.
  tbl-prefix: Table
  sec-prefix: Sec.


format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: quarto.css
    html-math-method: mathjax
    include-in-header: punctuation.html
    include-after-body:
      - sidebar-toc.html
      - header-pin.html
    number-depth: 3
    page-layout: full   # no right-hand column: the content uses the space
    fig-align: center
  pdf:
    subtitle: "Quantum Mechanics, Atoms, Molecules, and Spectra"
    documentclass: scrbook
    pdf-engine: xelatex
    mainfont: STIXTwoText        # STIX Two, from fonts/ (static files, so bold and italic work); one family for text, headings, and math
    mainfontoptions: [Path=./fonts/, Extension=.otf, UprightFont=*-Regular, ItalicFont=*-Italic, BoldFont=*-Bold, BoldItalicFont=*-BoldItalic]
    mathfont: STIXTwoMath-Regular.otf
    mathfontoptions: [Path=./fonts/]
    indent: true                 # indented paragraphs, as in printed books (no blank line between paragraphs)
    toc-title: Contents
    colorlinks: true             # clickable links shown in dark blue (cross-references, URLs, citations)
    linkcolor: "blue!55!black"
    urlcolor: "blue!55!black"
    citecolor: "blue!55!black"
    filecolor: "blue!55!black"
    classoption: [oneside]
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - margin=0.75in
    fontsize: 10pt
    include-in-header:
      - file: pdf-style.tex     # headings, captions, running heads, boxes
      - text: |
          \usepackage{cancel}
          \usepackage{booktabs}
          \usepackage{pdfpages}
          \AtBeginDocument{\ifcsname c@quartocallouttipno\endcsname\counterwithin{quartocallouttipno}{chapter}\fi}  % examples numbered by chapter
          \subject{The Live Textbook of Physical Chemistry, Volume 2}
          \AtBeginDocument{\title{Beyond the Classical World}}  % print title (the website keeps the series name)
          \AtBeginDocument{\subtitle{Quantum Mechanics, Atoms, Molecules, and Spectra}}  % the preface's own subtitle would otherwise replace it
          \AtBeginDocument{\includepdf[pages={1}]{FrontPage_6x9.pdf}}  % cover
          \DeclareOldFontCommand{\bf}{\normalfont\bfseries}{\mathbf}
          \DeclareOldFontCommand{\rm}{\normalfont\rmfamily}{\mathrm}
          \DeclareOldFontCommand{\it}{\normalfont\itshape}{\mathit}
    fig-pos: "htbp"
