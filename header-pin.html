<!-- Top bar: always visible on wide screens; on phones it still hides while scrolling down
     (Quarto's auto-hide), to leave more room for the text. -->
<script>
window.addEventListener("load", function () {
  if (!window.quartoToggleHeadroom) return;
  var wide = window.matchMedia("(min-width: 992px)");
  var frozen = false;
  function apply() {
    // freeze the auto-hide (with the bar shown) on wide screens, release it on narrow ones
    if (wide.matches !== frozen) {
      window.quartoToggleHeadroom();
      frozen = !frozen;
    }
  }
  apply();
  if (wide.addEventListener) wide.addEventListener("change", apply);
});

// "Report a bug" link in the top bar: icon only, with the label shown on hover
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll('#quarto-header a[href*="/issues/new"]').forEach(function (a) {
    a.setAttribute("title", "Report a bug");
    a.setAttribute("aria-label", "Report a bug");
  });
});
</script>
