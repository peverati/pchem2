<!-- Peverati research group logo at the top right (light and dark versions). -->
<script>
(function () {
  var a = document.createElement("a");
  a.className = "lab-logo";
  a.href = "https://peverati.github.io";
  a.title = "Peverati research group";
  // Both versions are inserted; CSS shows the one that matches the light/dark theme.
  a.innerHTML =
    '<img class="logo-for-light" src="img/logo-light.png" alt="Peverati research group logo">' +
    '<img class="logo-for-dark" src="img/logo-dark.png" alt="Peverati research group logo">';
  // Wide screens: top of the right-hand column (above the table of contents).
  // Narrow screens: right end of the top bar.
  var margin = document.querySelector("#quarto-margin-sidebar");
  var bar = document.querySelector("#quarto-header .quarto-secondary-nav .container-fluid") ||
            document.querySelector("#quarto-header nav");
  if (margin && getComputedStyle(margin).display !== "none") {
    a.classList.add("in-margin");
    margin.insertBefore(a, margin.firstChild);
  } else if (bar) {
    a.classList.add("in-bar");
    bar.appendChild(a);
  }
})();
</script>
